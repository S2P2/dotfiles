# Catppuccin Mocha theme — no plugins or special fonts required.
# Palette: https://catppuccin.com/palette/
# Reload with: tmux source-file ~/.tmux.conf

# Mouse: click panes and windows, drag borders, and scroll history.
set -g mouse on

# Keep more output in newly created panes.
set -g history-limit 50000

# Start window numbers at 1 and close numbering gaps automatically.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Open new windows and splits in the active pane's directory.
bind-key c new-window -c '#{pane_current_path}'
bind-key '"' split-window -v -c '#{pane_current_path}'
bind-key '%' split-window -h -c '#{pane_current_path}'
bind-key '|' split-window -h -c '#{pane_current_path}'
bind-key '-' split-window -v -c '#{pane_current_path}'

# Prefix + h/j/k/l moves left/down/up/right between panes.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Copy tmux selections to the local terminal clipboard over SSH (OSC 52).
set -s set-clipboard external

# Prefix + r reloads this configuration.
bind-key r source-file ~/.tmux.conf \; display-message 'tmux configuration reloaded'

# Mocha mantle background with mauve session and active-window accents.
set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-position bottom
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 110
set -g status-interval 3
set -g status-left '#[bg=#cba6f7,fg=#181825,bold] #S #[default] '
# Active-pane directory and Git context, followed by the existing host/date/time.
set -g status-right '#("$HOME/.local/bin/tmux-pane-context" #{pane_id}) #{?client_prefix,#[fg=#f9e2af bold] PREFIX  ,}#[fg=#94e2d5]#h #[fg=#45475a]| #[fg=#cdd6f4]%a %d %b #[fg=#cba6f7 bold]%H:%M '

setw -g window-status-separator ' '
setw -g window-status-style 'bg=#181825,fg=#a6adc8'
setw -g window-status-format ' #I  #W#{?window_zoomed_flag, Z,} '
setw -g window-status-current-style 'bg=#313244,fg=#cba6f7,bold'
setw -g window-status-current-format ' #I  #W#{?window_zoomed_flag, Z,} '
setw -g window-status-activity-style 'fg=#f9e2af'
setw -g window-status-bell-style 'fg=#f38ba8,bold'

# Pane borders, prompts, selection, and menus share the same palette.
setw -g pane-border-style 'fg=#313244'
setw -g pane-active-border-style 'fg=#94e2d5'
set -g display-panes-colour '#a6adc8'
set -g display-panes-active-colour '#cba6f7'
set -g message-style 'bg=#313244,fg=#cdd6f4'
set -g message-command-style 'bg=#313244,fg=#94e2d5'
setw -g mode-style 'bg=#45475a,fg=#cdd6f4'
setw -g clock-mode-colour '#cba6f7'
setw -g menu-style 'bg=#181825,fg=#cdd6f4'
setw -g menu-selected-style 'bg=#313244,fg=#cba6f7,bold'
setw -g menu-border-style 'fg=#45475a'
setw -g popup-style 'bg=#181825,fg=#cdd6f4'
setw -g popup-border-style 'fg=#cba6f7'

# Save the workspace every 15 minutes and restore when a new tmux server starts.
# Manual save: prefix + Ctrl-s. Manual restore: prefix + Ctrl-r.
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Manage plugins with prefix + I (install) and prefix + U (update).
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Keep TPM last and continuum last in the plugin list so autosave survives reloads.
if-shell 'test -f ~/.tmux/plugins/tpm/tpm' 'run-shell ~/.tmux/plugins/tpm/tpm'
